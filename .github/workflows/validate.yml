name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Plugin Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json', 'utf8'))"
          echo "✅ JSON files valid"

      - name: Validate JavaScript syntax
        run: |
          for f in scripts/*.mjs; do
            node --check "$f" && echo "✅ $f syntax OK"
          done

      - name: Validate command files exist
        run: |
          test -f commands/setup.md && echo "✅ setup.md"
          test -f commands/launch.md && echo "✅ launch.md"
          test -f commands/profiles.md && echo "✅ profiles.md"

      - name: Validate plugin.json structure
        run: |
          node -e "
            const p = JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const required = ['name', 'version', 'description', 'commands', 'hooks', 'scripts'];
            for (const field of required) {
              if (!p[field]) throw new Error('Missing field: ' + field);
            }
            console.log('✅ plugin.json has all required fields');
          "

      - name: Validate marketplace.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('marketplace.json', 'utf8'))"
          echo "✅ marketplace.json valid"